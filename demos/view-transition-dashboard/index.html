<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kinlo 後台儀表板：View Transitions 圓形轉場</title>
<!--
  Kinlo — cinema back office dashboard (recreation of 影片 37, Code & Chill)
  Key effect: document.startViewTransition + clip-path circle() on ::view-transition-new(root)
  Every sidebar item, tab and the theme toggle swap the UI inside a circular wipe that grows
  from the point you clicked. Falls back to an instant swap when the API is missing or
  prefers-reduced-motion is set.
  URL params:
    ?view=dashboard|finance|calendar|inbox|accounts|reports|hr|people|contracts|settings|help
    ?tab=cashflow|transactions|cards|budgets   (finance tab, default cards)
    ?theme=light|dark     ?code=1 (open code panel)     ?tour=1 (auto click-through)
    ?wipe=0 (force the no-transition fallback)          ?ms=400 (wipe duration)
  Keys: T = toggle theme, ` = toggle code panel
-->
<style>
:root{
  --font: Inter, "Inter var", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --bg:#F3F1EE; --bg-a:rgba(247,196,170,.55); --bg-b:rgba(170,222,222,.55); --bg-c:rgba(255,236,224,.7);
  --side:rgba(255,255,255,.45); --card:rgba(255,255,255,.72); --card-solid:#fff; --card-2:rgba(255,255,255,.55);
  --line:rgba(17,24,39,.08); --line-2:rgba(17,24,39,.14);
  --text:#121417; --muted:#6B7280; --muted-2:#9AA1AB;
  --teal:#1E6F7B; --teal-2:#2A8C99; --teal-ink:#fff; --teal-soft:rgba(30,111,123,.1);
  --ink:#121820; --ink-text:#fff;
  --salmon:#E9846B; --sand:#E9C38B; --mint:#7DCFB6; --red:#B4233A; --navy:#24364B;
  --sold:#1E6F7B; --free:rgba(17,24,39,.1);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 24px rgba(16,24,40,.06);
  --radius:18px;
}
[data-theme="dark"]{
  --bg:#0C1215; --bg-a:rgba(160,80,60,.22); --bg-b:rgba(30,120,130,.28); --bg-c:rgba(40,60,70,.3);
  --side:rgba(16,22,26,.6); --card:rgba(22,30,35,.78); --card-solid:#172025; --card-2:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --text:#E9EEF0; --muted:#94A3A8; --muted-2:#6C7B80;
  --teal:#2A97A5; --teal-2:#38B2C1; --teal-soft:rgba(56,178,193,.14);
  --ink:#E9EEF0; --ink-text:#0C1215;
  --sold:#38B2C1; --free:rgba(255,255,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 50% at 10% 85%,var(--bg-a),transparent 70%),
             radial-gradient(55% 60% at 95% 70%,var(--bg-b),transparent 70%),
             radial-gradient(70% 50% at 50% 10%,var(--bg-c),transparent 70%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---- view transition: no cross-fade, the new snapshot is revealed by a growing circle ---- */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}

/* ---- demo strip ---- */
.strip{display:flex;align-items:center;gap:12px;padding:7px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--card-2);flex-wrap:wrap}
.strip a{text-decoration:none;color:var(--text);border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;background:var(--card)}
.strip a:hover{border-color:var(--teal)}
.strip h1{font-size:13px;margin:0;color:var(--text);font-weight:650}
.strip .sp{flex:1}
.strip .src a{border:0;padding:0;background:none;color:var(--teal-2);text-decoration:underline}
.chip{border-radius:999px;padding:2px 9px;font-size:11px;border:1px solid var(--line-2)}
.chip.ok{color:#1b7f5a;border-color:rgba(27,127,90,.35)}
[data-theme="dark"] .chip.ok{color:#6fd3a8}
.chip.no{color:var(--red);border-color:rgba(180,35,58,.35)}

/* ---- app shell ---- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 36px)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:16px 14px;border-right:1px solid var(--line);background:var(--side);backdrop-filter:blur(8px);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 4px 14px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#2A8C99,#16606B);display:grid;place-items:center;color:#fff;box-shadow:0 4px 12px rgba(30,111,123,.35)}
.logo svg{width:20px;height:20px}
.brand b{font-size:17px;letter-spacing:-.01em;display:block}
.brand small{color:var(--muted);font-size:11.5px}
.brand .col{margin-left:auto;width:30px;height:30px;border:1px solid var(--line-2);border-radius:9px;background:var(--card);display:grid;place-items:center;color:var(--muted)}
.sec{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:14px 8px 6px}
.nav{list-style:none;margin:0;padding:0}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:11px;color:var(--text);opacity:.85;cursor:pointer;font-size:13.5px}
.nav button:hover{background:var(--teal-soft);opacity:1}
.nav button:focus-visible{outline:2px solid var(--teal-2);outline-offset:1px}
.nav button.on{background:var(--teal);color:var(--teal-ink);opacity:1;box-shadow:0 4px 14px rgba(30,111,123,.28)}
.nav .badge{margin-left:auto;font-size:10.5px;min-width:20px;height:20px;border-radius:999px;display:grid;place-items:center;padding:0 6px;background:var(--line-2);color:var(--text);font-weight:600}
.nav .badge.red{background:var(--red);color:#fff}
.nav button.on .badge{background:#fff;color:var(--teal)}
.nav .chev{margin-left:auto;width:14px;height:14px;opacity:.6}
.sub{list-style:none;margin:2px 0 4px 21px;padding:0 0 0 10px;border-left:1px solid var(--line-2)}
.sub button{all:unset;box-sizing:border-box;display:block;width:100%;padding:6px 10px;border-radius:9px;font-size:12.5px;color:var(--text);opacity:.8;cursor:pointer}
.sub button:hover{background:var(--teal-soft)}
.sub button.on{background:var(--line-2);opacity:1;font-weight:600}
.invite{margin:16px 2px 10px;display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--line-2);border-radius:12px;padding:9px;background:var(--card);font-weight:600;font-size:13px}
.invite:hover{border-color:var(--teal);color:var(--teal-2)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 2px;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--line-2);position:relative;flex:none}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:#23a26d;border:2px solid var(--card-solid)}
.me b{font-size:12.5px;display:block}.me small{color:var(--muted);font-size:11px}
.me .dots{margin-left:auto;color:var(--muted);letter-spacing:1px}

.main{min-width:0;padding:0 28px 40px}
.top{display:flex;align-items:center;gap:10px;height:62px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 40%,transparent);margin:0 -28px;padding:0 28px}
[data-theme="dark"] .top{background:linear-gradient(rgba(12,18,21,.9) 50%,transparent)}
.crumbs{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.crumbs b{color:var(--text);font-weight:600}
.crumbs i{font-style:normal;opacity:.5}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;width:min(330px,34vw);height:36px;padding:0 8px 0 12px;border:1px solid var(--line-2);border-radius:11px;background:var(--card);color:var(--muted)}
.search input{all:unset;flex:1;font-size:12.5px;color:var(--text);min-width:0}
.search kbd{font:600 10.5px var(--font);border:1px solid var(--line-2);border-radius:6px;padding:2px 6px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:11px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--teal)}
.btn.ink{background:var(--ink);color:var(--ink-text);border-color:transparent}
.btn.teal{background:var(--teal);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(30,111,123,.3)}
.ibtn{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;border:1px solid var(--line-2);background:var(--card);position:relative;flex:none}
.ibtn:hover{border-color:var(--teal)}
.ibtn .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:999px;background:var(--teal);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.top .av{width:36px;height:36px;background:linear-gradient(135deg,#E9C38B,#E9846B);color:#4a2618}

/* ---- page ---- */
.ph{display:flex;align-items:flex-end;gap:12px;margin:10px 0 16px;flex-wrap:wrap}
.ph h2{font-size:30px;letter-spacing:-.02em;margin:0;font-weight:650}
.ph p{margin:4px 0 0;color:var(--muted)}
.ph p b{color:var(--text);font-weight:600}
.ph .acts{margin-left:auto;display:flex;gap:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line-2);margin-bottom:16px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 10px 10px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--text);border-color:var(--teal);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--teal-2)}
.tabs .n{font-size:10.5px;background:var(--line-2);border-radius:999px;padding:1px 7px;color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;backdrop-filter:blur(10px);min-width:0}
.card h3{margin:0;font-size:15px;font-weight:650}
.card .sub2{color:var(--muted);font-size:12px;margin-top:2px}
.grid{display:grid;gap:14px}
.note{color:var(--muted);font-size:12.5px;margin:-4px 0 14px}
.seg{display:inline-flex;background:var(--line);border-radius:10px;padding:3px;gap:2px}
.seg span{padding:4px 10px;border-radius:8px;font-size:12px;color:var(--muted)}
.seg span.on{background:var(--card-solid);color:var(--text);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.pos{color:#1b7f5a}.neg{color:var(--red)}
[data-theme="dark"] .pos{color:#6fd3a8}[data-theme="dark"] .neg{color:#ff8a9a}

/* dashboard */
.dash-top{grid-template-columns:minmax(0,1.75fr) minmax(260px,1fr)}
.takings{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(170px,.8fr);gap:18px}
.big{font-size:34px;font-weight:650;letter-spacing:-.02em;margin:14px 0 2px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin:12px 0 4px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kv{list-style:none;margin:10px 0 0;padding:0}
.kv li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line-2);font-size:13px}
.kv li span{color:var(--muted)}
.bank{background:linear-gradient(160deg,#1E5A64,#163F48);color:#EAF4F5;border:0}
[data-theme="dark"] .bank{background:linear-gradient(160deg,#18454D,#0F2A31)}
.bank .sub2,.bank small{color:rgba(234,244,245,.65)}
.bank .bar{display:flex;gap:4px;height:7px;margin:14px 0 6px}
.bank .bar i{border-radius:4px}
.bank .kv li{border-color:rgba(255,255,255,.12)}.bank .kv li span{color:rgba(234,244,245,.7)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mini div{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}
.mini b{font-size:22px;display:block;margin-top:4px}
.dash-bot{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,.85fr);margin-top:14px}
.shows{list-style:none;margin:10px 0 0;padding:0}
.shows button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:8px 8px;border-radius:11px}
.shows button:hover{background:var(--teal-soft)}
.shows button.on{background:var(--teal-soft);box-shadow:inset 3px 0 0 var(--teal)}
.shows b{font-size:13px}.shows small{display:block;color:var(--muted);font-size:11px}
.shows .t{font-weight:700;font-size:13px}
.live{font-size:11px;font-weight:600;color:#1b7f5a;background:rgba(27,127,90,.1);border-radius:999px;padding:2px 8px}
.screen{height:6px;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(var(--teal-2),transparent);margin:12px 12% 14px;opacity:.7}
.seats{display:grid;gap:4px;justify-content:center}
.seats i{width:13px;height:11px;border-radius:3px 3px 5px 5px;background:var(--free);display:block}
.seats i.s{background:var(--sold)}
.seats i.gap{visibility:hidden}
.occ{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}
.occ b{color:var(--text);font-size:16px}
.prog{height:7px;border-radius:9px;background:var(--line-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:9px;background:var(--teal)}

/* finance */
.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{border-radius:20px;padding:18px 18px 14px;color:#fff;position:relative;overflow:hidden;min-height:150px;border:0;box-shadow:0 10px 30px rgba(16,24,40,.12)}
.kpi::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-70px;top:-90px;background:radial-gradient(rgba(255,255,255,.28),transparent 65%)}
.kpi.k1{background:linear-gradient(135deg,#D79C8C 0%,#A8695C 55%,#7B4A42 100%)}
.kpi.k2{background:linear-gradient(135deg,#1E6470 0%,#0F3E48 60%,#0A2A31 100%)}
.kpi.k3{background:linear-gradient(135deg,#BDEFDC 0%,#86D7BD 55%,#5DBFA4 100%);color:#0D3B30}
.kpi .lbl{font-size:12.5px;opacity:.85;display:flex;align-items:center;gap:7px}
.kpi .val{font-size:34px;font-weight:650;letter-spacing:-.02em;margin:12px 0 4px}
.kpi .chg{display:inline-flex;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.2)}
.kpi.k3 .chg{background:rgba(13,59,48,.12)}
.kpi svg.sp{position:absolute;right:14px;bottom:14px;width:46%;height:46px;opacity:.9}
.kpi .foot{font-size:11.5px;opacity:.75;margin-top:10px;max-width:50%}
.pcards{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px}
.pay{border-radius:16px;padding:16px;color:#fff;aspect-ratio:2.3;min-height:150px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.pay.c1{background:linear-gradient(140deg,#1A2A33,#0E171C)}
.pay.c2{background:linear-gradient(140deg,#2A93A2,#16606B)}
.pay.c3{background:linear-gradient(140deg,#F2A58E,#E9846B);color:#3a1a10}
.pay .chip2{width:30px;height:22px;border-radius:5px;background:linear-gradient(135deg,#F1D58C,#C9A24F);margin-top:14px}
.pay.c2 .chip2{background:linear-gradient(135deg,#f3f6f8,#c9d3da)}
.pay .no{margin-top:auto;font-size:15px;letter-spacing:.12em}
.pay .ft{display:flex;justify-content:space-between;font-size:11.5px;margin-top:8px;opacity:.85}
.spend .row{justify-content:space-between}
.spend .lim{font-size:14px;font-weight:650}
.tx{list-style:none;margin:10px 0 0;padding:0}
.tx li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.tx small{display:block;color:var(--muted);font-size:11px}
.cf{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{border-radius:16px;padding:14px;border:1px solid var(--line)}
.tile b{font-size:22px;display:block;margin:6px 0 2px}
.tile small{color:var(--muted)}
.t1{background:rgba(125,207,182,.22)}.t2{background:rgba(233,132,107,.2)}.t3{background:rgba(42,140,153,.15)}.t4{background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line-2)}
td{padding:10px;border-bottom:1px solid var(--line)}
td.r,th.r{text-align:right}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;background:var(--line-2)}
.bud{list-style:none;margin:0;padding:0}
.bud li{display:grid;grid-template-columns:150px 1fr 150px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

/* calendar */
.cal-wrap{grid-template-columns:minmax(0,1fr) 300px}
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-h .sp{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:11.5px;color:var(--muted);padding:0 8px 2px}
.day{min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--card-2);padding:7px 7px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day .d{font-size:12.5px;font-weight:600}
.day.out{opacity:.45}
.day.today{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.day.today .d{color:#fff;background:var(--teal);border-radius:999px;width:24px;height:24px;display:grid;place-items:center;margin:-3px 0 0 -3px}
.ev{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid currentColor}
.ev.teal{color:#1E6F7B;background:rgba(30,111,123,.12)}
.ev.red{color:#B4233A;background:rgba(180,35,58,.1)}
.ev.navy{color:#24364B;background:rgba(36,54,75,.1)}
.ev.orange{color:#C2571F;background:rgba(233,132,107,.18)}
.ev.mint{color:#1F7A5E;background:rgba(125,207,182,.25)}
.ev.sand{color:#8A5F17;background:rgba(233,195,139,.3)}
[data-theme="dark"] .ev.teal{color:#6fd0dc}[data-theme="dark"] .ev.red{color:#ff8a9a}[data-theme="dark"] .ev.navy{color:#a9c1dd;background:rgba(169,193,221,.12)}
[data-theme="dark"] .ev.orange{color:#ffab86}[data-theme="dark"] .ev.mint{color:#8ee6c8}[data-theme="dark"] .ev.sand{color:#f1cf93}
.side-list h4{font-size:10.5px;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.meet{display:flex;gap:10px;align-items:center;border-radius:12px;padding:10px;background:var(--teal-soft);border-left:3px solid var(--teal);margin-bottom:8px}
.meet b{font-size:12.5px;display:block}.meet small{color:var(--muted);font-size:11px}
.meet .tag{margin-left:auto;font-size:10.5px;font-weight:600;background:var(--card-solid);border-radius:999px;padding:3px 8px;white-space:nowrap}
.ul{list-style:none;margin:0;padding:0}
.ul li{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
.ul li .w{width:46px;font-weight:700;font-size:12px;flex:none}
.ul li small{display:block;color:var(--muted);font-size:11px}
.ul li .r{margin-left:auto;color:var(--muted);font-size:11.5px}
.agenda li{display:grid;grid-template-columns:110px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.list li{padding:12px 0}
.list li:last-child{border:0}

/* tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;background:#14232A;color:#fff;font-size:11.5px;border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .12s}
.tip b{font-size:13px;display:block;margin-bottom:3px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* code panel */
.code{position:fixed;right:16px;bottom:16px;z-index:40;width:min(580px,calc(100vw - 32px));border-radius:14px;background:#0B1622;color:#C9D6E3;box-shadow:0 18px 50px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);font-size:12px}
.code:not([open]){width:auto}
.code summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;font-weight:600;font-size:12px;user-select:none}
.code summary::-webkit-details-marker{display:none}
.code summary .dots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.code summary .f{margin:0 auto;color:#8EA3B5;font-family:var(--mono);font-weight:400}
.code summary .tg{font-family:var(--mono);background:rgba(255,255,255,.08);border-radius:6px;padding:1px 6px;font-weight:400}
.code summary .tw{transition:transform .2s}
.code[open] summary .tw{transform:rotate(180deg)}
.code pre{margin:0;padding:4px 14px 12px;font:12px/1.6 var(--mono);overflow:auto;max-height:52vh;counter-reset:ln}
.code pre .ln{display:block;white-space:pre}
.code pre .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:1.8em;margin-right:1em;text-align:right;color:#4C6072}
.code .k{color:#7FB4FF}.code .s{color:#9BE3A5}.code .c{color:#6C8296;font-style:italic}.code .n{color:#F6B97B}.code .fn{color:#F4D58D}.code .ty{color:#5FD7D0}
.code .hint{padding:0 14px 12px;color:#8EA3B5;font-size:11.5px;font-family:var(--font)}
.code .hint code{font-family:var(--mono);color:#F4D58D}

/* fake cursor for ?tour=1 */
.cursor{position:fixed;z-index:60;left:0;top:0;width:22px;height:22px;pointer-events:none;transition:transform .7s cubic-bezier(.4,0,.2,1);display:none}
.cursor svg{width:22px;height:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.ring{position:fixed;z-index:59;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 2px rgba(0,0,0,.25);pointer-events:none;animation:ring .5s ease-out forwards}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.3);opacity:0}}

/* responsive */
@media (max-width:1180px){
  .dash-top,.cal-wrap{grid-template-columns:1fr}
  .dash-bot{grid-template-columns:1fr 1fr}
  .cf{grid-template-columns:1fr 1fr}

}

    const t0 = performance.now(), dur = 1200;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = fmt(target * e);
      if (k < 1 && el.isConnected) requestAnimationFrame(step);
    };
    el.textContent = fmt(0);
    requestAnimationFrame(step);
  });
}

function seatsHTML(sh) {
  const total = sh[4], cols = total === 148 ? 16 : total === 92 ? 12 : 8, rows = Math.ceil(total / cols);
  const r = rng(total * 31 + sh[3]);
  const idx = [...Array(total).keys()];
  // favour centre / back seats, with some randomness
  const score = idx.map(i => { const row = Math.floor(i / cols), col = i % cols; return (row / rows) * .6 + (1 - Math.abs(col - (cols - 1) / 2) / cols) * .8 + r() * .9; });
  const sold = new Set(idx.slice().sort((a, b) => score[b] - score[a]).slice(0, sh[3]));
  let cells = '';
  for (let i = 0; i < rows * cols; i++) cells += i < total ? `<i class="${sold.has(i) ? 's' : ''}"></i>` : '<i class="gap"></i>';
  return `<div class="seats" id="seats" style="grid-template-columns:repeat(${cols},13px)">${cells}</div>`;
}

function viewGeneric(id) {
  const [t, s, rows] = GENERIC[id];
  return `<div class="ph"><div><h2>${t}</h2><p>${s}</p></div></div>
    <section class="card"><ul class="ul list">${rows.map(r => `<li><span><b>${r[0]}</b><small>${r[1]}</small></span><span class="r"><span class="pill">${r[2]}</span></span></li>`).join('')}</ul></section>
    <p class="note" style="margin-top:14px">This page is a stub — try <b>Dashboard</b>, <b>Calendar</b> or <b>Finance</b> to see the circular wipe between full views.</p>`;
}

/* ---------------- render ---------------- */
function renderNav() {
  let h = '', open = false;
  const close = () => { if (open) { h += '</ul>'; open = false; } };
  NAV.forEach(n => {
    if (n.sec) { close(); h += `<div class="sec">${n.sec}</div><ul class="nav">`; open = true; return; }
    const on = S.view === n.id;
    h += `<li><button type="button" data-go="${n.id}" class="${on ? 'on' : ''}" aria-current="${on ? 'page' : 'false'}">${ic(n.icon)}${n.label}${n.badge ? `<span class="badge${n.red ? ' red' : ''}">${n.badge}</span>` : (n.subs || n.chev) ? `<svg class="i chev" viewBox="0 0 24 24">${P.chev}</svg>` : ''}</button>`;
    if (n.subs && on) h += `<ul class="sub">${n.subs.map(([k, l]) => `<li><button type="button" data-go="${n.id}" ${n.id === 'finance' ? `data-tab="${k}"` : `data-ctabgo="${k}"`} class="${(n.id === 'finance' ? S.ftab : S.ctab) === k ? 'on' : ''}">${l}</button></li>`).join('')}</ul>`;
    h += '</li>';
  });
  close();
  $('#nav').innerHTML = h;
}
function renderCrumbs() {
  const v = NAV.find(n => n.id === S.view);
  let tail = '';
  if (S.view === 'finance') tail = ` <span>›</span> <b>${FTABS.find(t => t[0] === S.ftab)[1]}</b>`;
  if (S.view === 'calendar') tail = ` <span>›</span> <b>${S.ctab === 'month' ? 'October 2026' : 'Agenda'}</b>`;
  $('#crumbs').innerHTML = `<span>Kinlo</span> <span>›</span> <span>${SECTION[S.view]}</span> <span>›</span> ${tail ? `<span>${v.label}</span>${tail}` : `<b>${v.label}</b>`}`;
}
function render() {
  renderNav(); renderCrumbs();
  const view = $('#view');
  view.innerHTML = S.view === 'dashboard' ? viewDashboard() : S.view === 'finance' ? viewFinance() : S.view === 'calendar' ? viewCalendar() : viewGeneric(S.view);
  countUp(view);
  if (innerWidth <= 900) { const on = $('#nav button.on'); if (on) on.scrollIntoView({block:'nearest', inline:'center'}); }
  const u = new URL(location.href); u.searchParams.set('view', S.view);
  if (S.view === 'finance') u.searchParams.set('tab', S.ftab); else u.searchParams.delete('tab');
  history.replaceState(null, '', u);
}
function paintThemeBtn() {
  const dark = html.dataset.theme === 'dark';
  $('#themeBtn').innerHTML = ic(dark ? 'sun' : 'moon');
  $('#themeBtn').setAttribute('aria-pressed', String(dark));
}

/* ---------------- events ---------------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('button, [data-go]');
  if (!t) return;
  if (t.id === 'themeBtn') { setTheme(html.dataset.theme === 'dark' ? 'light' : 'dark', t); return; }
  if (t.dataset.show != null) {
    // in-place update, no wipe: only the seat map changes
    S.show = +t.dataset.show; const sh = SHOWS[S.show];
    document.querySelectorAll('[data-show]').forEach(b => b.classList.toggle('on', b === t));
    $('#seats').outerHTML = seatsHTML(sh);
    $('#houseSub').textContent = `${sh[0]} · ${sh[1]} · ${sh[2]}`;
    $('#houseOcc').textContent = Math.round(sh[3] / sh[4] * 100) + '%';
    return;
  }
  if (t.dataset.ftab) return navigate({ftab: t.dataset.ftab}, ev, t);
  if (t.dataset.ctab) return navigate({ctab: t.dataset.ctab}, ev, t);
  if (t.dataset.month != null) { const d = +t.dataset.month; return navigate({month: d ? Math.max(0, Math.min(11, S.month + d)) : 9}, ev, t); }
  if (t.dataset.go) {
    const p = {view: t.dataset.go};
    if (t.dataset.tab) p.ftab = t.dataset.tab;
    if (t.dataset.ctabgo) p.ctab = t.dataset.ctabgo;
    return navigate(p, ev, t);
  }
});
const tip = $('#tip');
document.addEventListener('pointermove', ev => {
  const col = ev.target.closest && ev.target.closest('#takings .col');
  if (!col) { tip.style.opacity = 0; return; }
  const i = +col.dataset.i, tot = (BOX[i] + BAR[i] + HIRE[i]) * 1000;
  tip.innerHTML = `<b>${MONTHS[i]} · ${gbp(tot)}</b><i style="background:#5FC6D3"></i>Box office ${gbp(BOX[i] * 1000)}<br><i style="background:#E9846B"></i>Bar &amp; kiosk ${gbp(BAR[i] * 1000)}<br><i style="background:#E9C38B"></i>Private hire ${gbp(HIRE[i] * 1000)}<br>${Math.round(ADM[i] * 1000).toLocaleString('en-GB')} admissions`;
  tip.style.left = Math.min(innerWidth - 200, ev.clientX + 14) + 'px';
  tip.style.top = (ev.clientY + 14) + 'px';
  tip.style.opacity = 1;
});
document.addEventListener('keydown', ev => {
  if (ev.target.matches('input, textarea') || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === 't' || ev.key === 'T') setTheme(html.dataset.theme === 'dark' ? 'light' : 'dark', $('#themeBtn'));
  if (ev.key === '`') $('#code').open = !$('#code').open;
});

/* ---------------- ?tour=1 : fake cursor click-through (for recording) ---------------- */
async function tour() {
  const cur = $('#cursor'), wait = ms => new Promise(r => setTimeout(r, ms));
  cur.style.display = 'block'; cur.style.transform = `translate(${innerWidth * .6}px,${innerHeight * .6}px)`;
  const clickOn = async sel => {
    const el = typeof sel === 'string' ? $(sel) : sel(); if (!el) return;
    const r = el.getBoundingClientRect(), x = r.left + Math.min(r.width / 2, 60), y = r.top + r.height / 2;
    cur.style.transform = `translate(${x - 3}px,${y - 2}px)`; await wait(800);
    const ring = document.createElement('div'); ring.className = 'ring'; ring.style.left = x + 'px'; ring.style.top = y + 'px'; document.body.appendChild(ring); setTimeout(() => ring.remove(), 600);
    el.dispatchEvent(new MouseEvent('click', {bubbles: true, clientX: x, clientY: y, detail: 1})); await wait(1500);
  };
  for (;;) {
    await clickOn('[data-go="dashboard"]');
    await clickOn('[data-go="finance"]');
    await clickOn('[data-ftab="cashflow"]');
    await clickOn('[data-ftab="cards"]');
    await clickOn('#nav [data-go="calendar"]');
    await clickOn('#themeBtn');
    await clickOn('[data-go="finance"]');
    await clickOn('#themeBtn');
    await wait(800);
  }
}

/* ---------------- init ---------------- */
let saved = null; try { saved = localStorage.getItem('kinlo-theme'); } catch (e) {}
html.dataset.theme = ['light', 'dark'].includes(Q.get('theme')) ? Q.get('theme') : (saved || 'light');
paintThemeBtn();
$('#codePre').innerHTML = highlight(CODE);
if (Q.get('code') === '1') $('#code').open = true;
const chip = $('#vtChip');
if (supported && !reduced()) { chip.textContent = `View Transitions ✓ · ${WIPE_MS}ms`; chip.className = 'chip ok'; }
else { chip.textContent = typeof document.startViewTransition !== 'function' ? '瀏覽器不支援 → 直接切換' : reduced() ? '減少動態效果 → 直接切換' : '已關閉轉場（?wipe=0）'; chip.className = 'chip no'; }
render();
window.__kinlo = { S, navigate, setTheme, circleWipe, render };
if (Q.get('tour') === '1') tour();
})();
</script>
