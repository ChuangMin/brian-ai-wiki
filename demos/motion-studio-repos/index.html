<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>14 個 repo 的動態影像工作室（示範）</title>
<style>
  :root {
    --bg:#f3efe6; --paper:#fffcf7; --ink:#1c1915; --muted:#6f6a60;
    --line:#e3ddd2; --accent:#5b4fd8; --ok:#2f7a48; --warn:#9a4b1f; --chip:#f6f1e8;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; color:var(--ink);
    font:15px/1.55 ui-sans-serif, system-ui, "Noto Sans TC", sans-serif;
    background:
      radial-gradient(900px 480px at 90% -10%, #efe7d8 0%, transparent 60%),
      radial-gradient(700px 400px at 0% 100%, #e7ece8 0%, transparent 55%),
      var(--bg);
  }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 20px 56px; }
  .top { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .top a { color:var(--muted); font-size:13px; }
  .lang { display:flex; gap:0; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
  .lang button { appearance:none; border:0; background:transparent; padding:6px 12px; cursor:pointer; font:inherit; color:var(--muted); }
  .lang button[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .banner {
    border:1px solid #e6d7b4; background:#fff8ea; color:#5c4a20;
    padding:10px 14px; border-radius:10px; font-size:13px; margin:0 0 18px;
  }
  h1 { font-size:28px; letter-spacing:.01em; margin:0 0 6px; }
  .sub { color:var(--muted); margin:0 0 18px; }
  .counters { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 0 18px; }
  .counter { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .counter b { display:block; font-size:28px; font-variant-numeric:tabular-nums; color:var(--accent); }
  .counter span { color:var(--muted); font-size:13px; }
  .toolbar { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 14px; }
  .views, .filters { display:flex; flex-wrap:wrap; gap:8px; }
  .views button, .filters button {
    appearance:none; border:1px solid var(--line); background:var(--chip); color:var(--ink);
    border-radius:999px; padding:7px 13px; cursor:pointer; font:inherit;
  }
  .views button[aria-pressed="true"], .filters button[aria-pressed="true"] {
    background:var(--ink); color:#fff; border-color:var(--ink);
  }
  .stage { position:relative; min-height:420px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .card {
    text-align:left; background:var(--paper); border:1px solid var(--line); border-radius:16px;
    padding:14px 16px; color:inherit; cursor:pointer; font:inherit; width:100%;
  }
  .card[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .card .k { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .card h2 { font-size:16px; margin:0; }
  .card .cat { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  .meta { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .pill { font-size:11px; border-radius:999px; padding:2px 8px; border:1px solid var(--line); color:var(--muted); }
  .pill.ok { color:var(--ok); border-color:#c9e3d0; }
  .pill.warn { color:var(--warn); border-color:#f0d2b8; }
  .note { color:var(--muted); font-size:13px; min-height:2.8em; margin:0; }
  .stack-wrap, .helix-wrap { height:520px; position:relative; }
  .stack-wrap .card, .helix-wrap .card {
    position:absolute; left:50%; top:50%; width:min(420px, 86vw);
    transform-origin:center center; transition:transform .45s ease, opacity .45s ease, box-shadow .45s ease;
  }
  .helix-wrap { perspective:1200px; overflow:hidden; }
  .detail { margin-top:20px; background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .detail h3 { margin:0 0 8px; font-size:18px; }
  .detail a { color:var(--accent); }
  footer { margin-top:24px; color:var(--muted); font-size:12px; }
  @media (max-width:700px){
    .counters{grid-template-columns:1fr;} h1{font-size:22px;}
    .stack-wrap,.helix-wrap{height:460px;}
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a href="../index.html" data-i="home">← wiki 首頁 / Home</a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="btn-zh" aria-pressed="true">中文</button>
        <button type="button" id="btn-en" aria-pressed="false">English</button>
      </div>
    </div>
    <div class="banner" id="banner"></div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="counters">
      <div class="counter"><b>418K</b><span id="c1"></span></div>
      <div class="counter"><b>421,958</b><span id="c2"></span></div>
    </div>
    <div class="toolbar">
      <div class="views" id="views"></div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="stage" id="stage"></div>
    <div class="detail" id="detail" hidden></div>
    <footer id="foot"></footer>
  </div>
<script>
const COPY = {
  zh: {
    banner: "這是依 Altair AI 概念 HUD 重製的互動頁，不是 Adobe 或 Fable 的產品，也不會連網或執行生成模型。畫面星數合計 418K，2026-11-16 查證合計 421,958，都是快照。生成模型不是 0 元就能跑，Fable 5.2 本身也不是免費方案。",
    title: "14 個免費 repo？還不是一間動態影像工作室",
    sub: "可切換 Helix／Stack／Grid，並依 Motion、Physics、Data、2D、3D、AI video、Sound 篩選。每張卡都有授權與需要注意的地方。",
    c1: "畫面星數合計（快照，不是即時數字）",
    c2: "2026-11-16 查證合計（GitHub API 快照）",
    views: {helix:"Helix", stack:"Stack", grid:"Grid"},
    filters: {all:"全部", motion:"Motion", physics:"Physics", data:"Data", d2:"2D", d3:"3D", aivideo:"AI video", sound:"Sound"},
    hud: "畫面",
    snap: "查證",
    license: "授權",
    foot: "示範資料來自 2026-11-16 的畫面與查證快照。GitHub 連結只在你點下去時才會離開本頁。本頁不做推論或生成。",
    home: "← wiki 首頁 / Home"
  },
  en: {
    banner: "This is a recreation of Altair AI’s concept HUD, not an Adobe or Fable product. It does not go online or run any generative model. The on-screen total is 418K stars; a 2026-11-16 check summed to 421,958. Both are snapshots. Generative models are not free to run, and Fable 5.2 itself is not a $0 plan.",
    title: "14 free repos is not one motion studio",
    sub: "Switch Helix, Stack, or Grid, and filter by Motion, Physics, Data, 2D, 3D, AI video, or Sound. Each card has its license and a caveat.",
    c1: "On-screen star total (a snapshot, not live)",
    c2: "2026-11-16 check total (GitHub API snapshot)",
    views: {helix:"Helix", stack:"Stack", grid:"Grid"},
    filters: {all:"All", motion:"Motion", physics:"Physics", data:"Data", d2:"2D", d3:"3D", aivideo:"AI video", sound:"Sound"},
    hud: "on screen",
    snap: "checked",
    license: "License",
    foot: "Demo data is from the 2026-11-16 on-screen and API snapshots. GitHub links leave this page only when you click them. This page does not run inference or generation.",
    home: "← wiki home / 首頁"
  }
};
const REPOS = [
  {n:"01", id:"anime.js", cat:"motion", license:"MIT", licenseClass:"ok", hud:"74k", snap:"74,769", url:"https://github.com/juliangarnier/anime",
   role:{zh:"網頁動畫引擎。", en:"A JavaScript animation engine."},
   extra:{zh:"授權與「免費開源」印章大致相符（MIT）。", en:"The MIT license matches the free-and-open stamp reasonably well."}},
  {n:"02", id:"react-spring", cat:"motion", license:"MIT", licenseClass:"ok", hud:"29.3k", snap:"29,302", url:"https://github.com/pmndrs/react-spring",
   role:{zh:"用彈簧物理做 React 介面動作。", en:"Spring-physics motion for React UIs."},
   extra:{zh:"MIT。這是 UI 動畫庫，不是影視後期軟體。", en:"MIT. A UI animation library, not a film finishing tool."}},
  {n:"03", id:"PixiJS", cat:"motion", license:"MIT", licenseClass:"ok", hud:"48.7k", snap:"48,741", url:"https://github.com/pixijs/pixijs",
   role:{zh:"2D WebGL 渲染，常用在粒子與即時場景。", en:"A 2D WebGL renderer, often used for particles and realtime scenes."},
   extra:{zh:"MIT。要在瀏覽器裡跑，不是 After Effects 外掛。", en:"MIT. It runs in the browser; it is not an After Effects plugin."}},
  {n:"04", id:"p5.js", cat:"motion", license:"LGPL-2.1", licenseClass:"warn", hud:"24k", snap:"24,362", url:"https://github.com/processing/p5.js",
   role:{zh:"創意程式與生成畫面。畫面歸在 Motion。", en:"Creative coding and generative visuals. Tagged Motion on the slide."},
   extra:{zh:"授權是 LGPL-2.1，不是 MIT；「FREE · OPEN SOURCE」只說對一半。", en:"The license is LGPL-2.1, not MIT. A generic FREE · OPEN SOURCE stamp is only partly right."}},
  {n:"05", id:"matter-js", cat:"physics", license:"MIT", licenseClass:"ok", hud:"18.4k", snap:"18,640", url:"https://github.com/liabru/matter-js",
   role:{zh:"瀏覽器裡的 2D 剛體物理。", en:"A 2D rigid-body physics engine for the browser."},
   extra:{zh:"MIT。負責碰撞與掉落，不是整套後期流程。", en:"MIT. It handles collisions and drops, not a full finishing pipeline."}},
  {n:"06", id:"D3", cat:"data", license:"ISC", licenseClass:"ok", hud:"113.8k", snap:"113,934", url:"https://github.com/d3/d3",
   role:{zh:"資料驅動的圖表與可動畫視覺化。", en:"Data-driven charts and animated visualizations."},
   extra:{zh:"授權是 ISC，不是 MIT。仍然是寬鬆開源，但不算同一種授權。", en:"The license is ISC, not MIT. It is still a permissive open-source license, just not the same one."}},
  {n:"07", id:"OpenToonz", cat:"d2", license:"BSD-3", licenseClass:"ok", hud:"7.9k", snap:"8,255", url:"https://github.com/opentoonz/opentoonz",
   role:{zh:"2D 動畫製作軟體。源於 Studio Ghibli 的 Toonz，由 DWANGO 開源。", en:"A 2D animation suite based on Studio Ghibli’s Toonz, opened by DWANGO."},
   extra:{zh:"BSD-3-Clause。GitHub 的 SPDX 常顯示 NOASSERTION，因為授權檔還有附加說明。這是桌面軟體，不是瀏覽器函式庫。", en:"BSD-3-Clause. GitHub’s SPDX field often shows NOASSERTION because of extra notices in the license file. This is a desktop app, not a browser library."}},
  {n:"08", id:"Hunyuan3D-2", cat:"d3", license:"Tencent 社群授權", licenseClass:"warn", hud:"15.2k", snap:"15,429", url:"https://github.com/Tencent-Hunyuan/Hunyuan3D-2",
   role:{zh:"單張圖轉成有貼圖的 3D 模型。", en:"Turns one image into a textured 3D model."},
   extra:{zh:"騰訊混元社群授權，不是 MIT；在歐盟、英國、韓國不可用。要 GPU，不是 0 元算力。", en:"Tencent’s community license, not MIT; not available in the EU, the UK, or South Korea. It needs a GPU, so it is not zero-cost compute."}},
  {n:"09", id:"TRELLIS", cat:"d3", license:"MIT", licenseClass:"ok", hud:"14.1k", snap:"14,285", url:"https://github.com/microsoft/TRELLIS",
   role:{zh:"Microsoft 的開源 3D 生成（圖轉 3D 資產）。", en:"Microsoft’s open 3D generator, from image to 3D asset."},
   extra:{zh:"程式是 MIT，但仍要 GPU 才能實跑，不是「不用 render farm」就能略過算力。", en:"The code is MIT, but it still needs a GPU. “No render farm” does not mean no compute."}},
  {n:"10", id:"LTX-2", cat:"aivideo", license:"Apache-2.0＋權重條款", licenseClass:"warn", hud:"9.8k", snap:"10,253", url:"https://github.com/Lightricks/LTX-2",
   role:{zh:"開源音訊＋影片生成。說明文寫 up to 4K；準備查證解析度為 3840×2176。", en:"Open audio-and-video generation. The caption says up to 4K; prep notes the resolution as 3840×2176."},
   extra:{zh:"程式是 Apache-2.0，權重另有社群授權，不能只看成完全免費。本頁不執行生成。", en:"The code is Apache-2.0; the weights have a separate community license, so this is not simply free. This page does not run generation."}},
  {n:"11", id:"LivePortrait", cat:"aivideo", license:"MIT＋InsightFace 限制", licenseClass:"warn", hud:"19.3k", snap:"19,493", url:"https://github.com/KlingAIResearch/LivePortrait",
   role:{zh:"讓靜態肖像說話、眨眼與擺動。倉庫現在在 KlingAIResearch（舊路徑 KwaiVGI 會轉址）。", en:"Makes a still portrait talk, blink, and move. The repo now lives under KlingAIResearch (the old KwaiVGI path redirects)."},
   extra:{zh:"程式是 MIT，但 InsightFace 相關權重是非商業條款，「FREE · OPEN SOURCE」不完整。", en:"The code is MIT, but InsightFace-related weights are non-commercial. A FREE · OPEN SOURCE stamp is incomplete."}},
  {n:"12", id:"RIFE", cat:"aivideo", license:"MIT", licenseClass:"ok", hud:"5.6k", snap:"5,699", url:"https://github.com/hzwer/ECCV2022-RIFE",
   role:{zh:"補中間幀，用來做順一點的慢動作或提高幀率。", en:"Frame interpolation for smoother slow motion or a higher frame rate."},
   extra:{zh:"MIT。仍要運算資源，不是點一下就替代整套後期。", en:"MIT. It still needs compute, and it is not a one-click substitute for a finishing suite."}},
  {n:"13", id:"MusicGen", cat:"sound", license:"MIT（權重另查）", licenseClass:"warn", hud:"23.8k", snap:"23,879", url:"https://github.com/facebookresearch/audiocraft",
   role:{zh:"以文字描述生成配樂；倉庫是 facebookresearch/audiocraft。", en:"Text-to-music. The repository is facebookresearch/audiocraft."},
   extra:{zh:"函式庫是 MIT，模型權重要另外看條款，不能直接當成全部 0 元商用。", en:"The library is MIT; the model weights have their own terms, so this is not automatically $0 for commercial use."}},
  {n:"14", id:"Tone.js", cat:"sound", license:"MIT", licenseClass:"ok", hud:"14.7k", snap:"14,917", url:"https://github.com/Tonejs/Tone.js",
   role:{zh:"在瀏覽器裡做合成器、節奏與聲音設計。", en:"Synths, beats, and sound design in the browser."},
   extra:{zh:"MIT。這是 Web Audio 框架，不是生成模型。", en:"MIT. This is a Web Audio framework, not a generative model."}}
];
let lang="zh", view="grid", filter="all", current=null;
const stage=document.getElementById("stage");
const detail=document.getElementById("detail");
function t(){ return COPY[lang]; }
function filtered(){ return REPOS.filter(r => filter==="all" || r.cat===filter); }
function pill(r){
  return `<span class="pill ${r.licenseClass}">${r.license}</span><span class="pill">${t().hud} ${r.hud}</span><span class="pill">${t().snap} ${r.snap}</span>`;
}
function cardHTML(r){
  return `<div class="k"><h2>${r.n}  ${r.id}</h2><span class="cat">${r.cat === "d2" ? "2D" : r.cat === "d3" ? "3D" : r.cat === "aivideo" ? "AI video" : r.cat}</span></div>
    <div class="meta">${pill(r)}</div>
    <p class="note">${r.role[lang]}</p>`;
}
function bindCard(el, r){
  el.addEventListener("click", () => { current = r.id; show(r); render(); });
}
function show(r){
  detail.hidden = false;
  detail.innerHTML = `<h3>${r.n}  ${r.id}</h3>
    <p>${r.role[lang]} ${r.extra[lang]}</p>
    <p>${t().license}：${r.license}　${t().hud}：${r.hud}　${t().snap}：${r.snap}</p>
    <p><a href="${r.url}" target="_blank" rel="noopener">${r.url}</a></p>`;
}
function renderChrome(){
  const c=t();
  document.getElementById("banner").textContent=c.banner;
  document.getElementById("title").textContent=c.title;
  document.getElementById("sub").textContent=c.sub;
  document.getElementById("c1").textContent=c.c1;
  document.getElementById("c2").textContent=c.c2;
  document.getElementById("foot").textContent=c.foot;
  document.querySelector('[data-i="home"]').textContent=c.home;
  document.getElementById("btn-zh").setAttribute("aria-pressed", String(lang==="zh"));
  document.getElementById("btn-en").setAttribute("aria-pressed", String(lang==="en"));
  const views=document.getElementById("views");
  views.innerHTML="";
  ["helix","stack","grid"].forEach(id=>{
    const b=document.createElement("button");
    b.type="button"; b.textContent=c.views[id];
    b.setAttribute("aria-pressed", String(view===id));
    b.addEventListener("click",()=>{view=id; render();});
    views.appendChild(b);
  });
  const filters=document.getElementById("filters");
  filters.innerHTML="";
  [["all","all"],["motion","motion"],["physics","physics"],["data","data"],["d2","d2"],["d3","d3"],["aivideo","aivideo"],["sound","sound"]].forEach(([id,key])=>{
    const b=document.createElement("button");
    b.type="button"; b.textContent=c.filters[key];
    b.setAttribute("aria-pressed", String(filter===id));
    b.addEventListener("click",()=>{filter=id; render();});
    filters.appendChild(b);
  });
}
function renderGrid(list){
  const g=document.createElement("div"); g.className="grid";
  list.forEach(r=>{
    const b=document.createElement("button");
    b.className="card"; b.type="button";
    b.setAttribute("aria-pressed", String(current===r.id));
    b.innerHTML=cardHTML(r); bindCard(b,r); g.appendChild(b);
  });
  stage.appendChild(g);
}
function renderStack(list){
  const w=document.createElement("div"); w.className="stack-wrap";
  const n=list.length || 1;
  const sel=Math.max(0, list.findIndex(r=>r.id===current));
  list.forEach((r,i)=>{
    const b=document.createElement("button");
    b.className="card"; b.type="button";
    b.setAttribute("aria-pressed", String(current===r.id));
    b.innerHTML=cardHTML(r); bindCard(b,r);
    const off=i-sel;
    const z=100-Math.abs(off);
    b.style.zIndex=String(z);
    b.style.transform=`translate(-50%, calc(-50% + ${off*18}px)) scale(${1-Math.min(Math.abs(off)*0.04,0.2)})`;
    b.style.opacity=String(Math.max(0.35, 1-Math.abs(off)*0.12));
    w.appendChild(b);
  });
  stage.appendChild(w);
}
function renderHelix(list){
  const w=document.createElement("div"); w.className="helix-wrap";
  const sel=Math.max(0, list.findIndex(r=>r.id===current));
  list.forEach((r,i)=>{
    const b=document.createElement("button");
    b.className="card"; b.type="button";
    b.setAttribute("aria-pressed", String(current===r.id));
    b.innerHTML=cardHTML(r); bindCard(b,r);
    const off=i-sel;
    const ang=off*18;
    const z=-Math.abs(off)*70;
    const y=off*28;
    const x=Math.sin(off*0.35)*120;
    b.style.zIndex=String(100-Math.abs(off));
    b.style.transform=`translate(-50%, -50%) translateX(${x}px) translateY(${y}px) translateZ(${z}px) rotateY(${-ang}deg)`;
    b.style.opacity=String(Math.max(0.25, 1-Math.abs(off)*0.14));
    w.appendChild(b);
  });
  stage.appendChild(w);
}
function render(){
  renderChrome();
  stage.innerHTML="";
  const list=filtered();
  if(view==="helix") renderHelix(list);
  else if(view==="stack") renderStack(list);
  else renderGrid(list);
  if(current && !list.some(r=>r.id===current)) { detail.hidden=true; }
}
document.getElementById("btn-zh").addEventListener("click",()=>{lang="zh"; render(); if(current){ const r=REPOS.find(x=>x.id===current); if(r) show(r);} });
document.getElementById("btn-en").addEventListener("click",()=>{lang="en"; render(); if(current){ const r=REPOS.find(x=>x.id===current); if(r) show(r);} });
render();
</script>
</body>
</html>
